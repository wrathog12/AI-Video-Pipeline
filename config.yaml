schema_version: 2

project:
  fps: 30
  # Canvas is authoritative. Aspect ratio is derived from it, not the reverse.
  width: 1920
  height: 1080
  # Scale applied at render time. 0.4445 * 1920x1080 => 854x480 (480p, R4 legibility floor).
  # Set to 1.0 for full-resolution delivery.
  output_scale: 0.4445
  # "landscape" | "portrait" | "auto" (derived from width/height)
  orientation: auto

# Selectable with `./run --profile portrait`. Proves aspect ratio is config, not code (R7).
profiles:
  portrait:
    project:
      width: 1080
      height: 1920

theme:
  font_family: "Inter"
  type_scale_base_vmin: 3.2   # type sizes are multiples of vmin, never hardcoded px
  min_font_px: 22             # hard floor, enforced after output_scale
  primary_color: "#E63946"
  secondary_color: "#4EA8DE"
  background_color: "#0D1117"
  text_color: "#F8F9FA"
  muted_color: "#8B949E"

segmentation:
  target_seconds: 12.0
  min_seconds: 4.0
  max_seconds: 20.0
  words_per_minute: 165

providers:
  # Annotation only — the LLM never computes, never chooses scene boundaries and
  # never emits code. Dispatch is by vendor prefix (llm_annotator.get_annotator),
  # so any gemini-* or claude-* model id works without a code change, and
  # "heuristic" runs the offline rule-based annotator with no key at all.
  llm: "gemini-2.5-flash"
  # cartesia is the primary provider (quality + word timestamps).
  # edge-tts remains the fallback: free, no key, and it works offline of any
  # paid account — so a dead key at the live review still yields a video.
  tts: "edge-tts"       # cartesia | edge-tts | piper
  aligner: "native"     # native | whisperx
  assets: "null"        # null | icon_pack
  renderer: "remotion"

tts:
  # One voice per provider: a voice id is provider-specific (Cartesia uses a
  # UUID, edge-tts a name), so switching providers must not require editing the
  # voice too (R7).
  voices:
    cartesia: "bf0a246a-8642-498a-9950-80c35e9276b5"
    edge-tts: "en-US-AriaNeural"
    piper: "en_US-lessac-medium"
  # voice:              # uncomment to override the table for every provider
  model: "sonic-3.5"    # Cartesia model_id; ignored by other providers
  language: "en"
  # Provider-neutral rate. Each provider translates: edge-tts takes it directly,
  # Cartesia maps it onto generation_config.speed (0.6-1.5).
  rate: "+0%"
  # Canonical PCM format. All hashing happens on decoded samples in this format,
  # never on container bytes (see context.md §6 Stage 5).
  sample_rate: 24000
  channels: 1

audio:
  # Silence padding inserted between scenes so boundaries land on frame edges.
  scene_gap_ms: 250
  lead_in_ms: 300
  tail_ms: 500

determinism:
  require_cache: false
  ban_wallclock: true

qa:
  ocr_gate: false           # enabled in Phase 3
  ocr_min_confidence: 60
